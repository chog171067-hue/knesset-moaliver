<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>התשלום התקבל</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #F4ECDD; color: #3E2F23; font-family: "Segoe UI", Arial, sans-serif; }
  .card { background: #FFFDF8; border: 1px solid #E6D9C3; border-radius: 20px; padding: 32px 36px;
          max-width: 420px; margin: 16px; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 10px; }
  p { font-size: 16px; color: #5B4636; margin: 0; line-height: 1.6; }
</style>
</head>
<body>
  <!-- דף החזרה אחרי תשלום בדף של נדרים פלוס שנפתח מעמדת הקיוסק. העמדה עצמה מזהה את
       המעבר לכאן ולא מציגה את הדף; הוא קיים רק למקרה שהקישור נפתח מחוץ לעמדה. -->
  <div class="card">
    <h1>התשלום התקבל</h1>
    <p>הסכום ייטען ליתרה בחשבון הקיוסק תוך מספר שניות. אפשר לחזור לעמדה.</p>
  </div>
</body>
</html>
