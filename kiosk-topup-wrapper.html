<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>הטענת כסף - קיוסק</title>
<style>
  /* המסגרת סביב הטופס בעמדה. את השדות עצמם (בתוך הטופס של נדרים פלוס) אי אפשר לעצב -
     לפי התיעוד אין לטופס פרמטר עיצוב - לכן מעצבים את מה שסביבם: רקע, ריווח, מרכוז */
  html, body { margin: 0; padding: 0; background: #ffffff; overflow: hidden; }
  body { font-family: "Segoe UI", Arial, sans-serif; color: #3E2F23; }
  .wrap { max-width: 440px; margin: 0 auto; padding: 4px 0; }
  #NedarimFrame { display: block; width: 100%; border: none; height: 360px; }
</style>
</head>
<body>
<div class="wrap"><iframe id="NedarimFrame" scrolling="no" title="פרטי כרטיס אשראי"></iframe></div>
<script>
  // דף מתווך לחלון הטענת הכסף בעמדת הקיוסק (נטען ב-WebView2, ראו TopupWindow.xaml.cs).
  // חייב להיות מאוחסן באתר (כתובת https אמיתית): הטופס של נדרים פלוס לא שולח את
  // התשובה (אושר/נדחה) לדף בלי כתובת, כמו דף שנוצר בתוך התוכנה עצמה.
  var frame = document.getElementById('NedarimFrame');
  var webview = window.chrome && window.chrome.webview;
  if (!webview) {
    document.body.innerHTML = '<p style="padding:20px;">דף זה מיועד לעמדת הקיוסק בלבד.</p>';
  }

  window.addEventListener('message', function (event) {
    if (!webview || event.source !== frame.contentWindow) return;
    if (!event.data || !event.data.Name) return;
    if (event.data.Name === 'Height') {
      // הטופס מודיע מה הגובה שלו - המסגרת מתאימה את עצמה (והעמדה מתאימה את החלון)
      var h = parseInt(event.data.Value, 10);
      if (h > 0) frame.style.height = h + 'px';
    }
    if (event.data.Name === 'Height' || event.data.Name === 'TransactionResponse') {
      webview.postMessage(event.data);
    }
  });

  if (webview) webview.addEventListener('message', function (event) {
    var msg = event.data;
    if (!msg || !msg.Name) return;
    if (msg.Name === 'StartTransaction') {
      frame.contentWindow.postMessage({ Name: 'FinishTransaction', Value: msg.TransactionId }, '*');
    }
  });

  frame.onload = function () {
    frame.contentWindow.postMessage({ Name: 'GetHeight' }, '*');
  };
  if (webview) frame.src = 'https://www.matara.pro/nedarimplus/iframe/';
</script>
</body>
</html>
